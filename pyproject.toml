[project]
name = "elon-topuvchi"
version = "0.1.0"
description = "Telegram e'lon kanallaridan e'lon yig'ib, AI bilan saralab beradigan bot (MVP)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.13,<4",
    "anthropic>=0.40",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0.30",
    "telethon>=1.36,<2",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "E501", # uzun satrlar: formatter kodni o'zi sig'diradi, matnlar bo'linmaydi
    "S101", # assert tip toraytirish uchun ishlatiladi
    "RUF001", # o'zbek/rus matnlarida kirill harflari ataylab ishlatiladi
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true
