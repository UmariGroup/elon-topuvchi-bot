# Uchta servis: bot + collector + db.
# Hech qaysi port tashqariga ochilmaydi (bot long-polling ishlatadi, baza faqat ichki
# tarmoqda) — shuning uchun serverdagi n8n yoki boshqa servislar bilan port to'qnashmaydi.
name: elon-topuvchi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elon
      POSTGRES_DB: elon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida berilishi kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elon -d elon"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "elon.bot.main"]

  collector:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tgsession:/data
      - ./config:/app/config:ro
    command: ["python", "-m", "elon.collector.main"]

volumes:
  pgdata:
  tgsession:
