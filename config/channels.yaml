# Yig'iladigan Telegram kanallar ro'yxati.
#
# HOLATI: boshlang'ich TAKLIF — tasdiqlanmagan. Bu kanallar 2026-11-13 da ochiq veb-manbalardan
# (t.me/s, TGStat, Telemetr) topildi; har birining hozir faol ekani va e'lon sifati
# Telegram akkaunt orqali tekshirilmagan. Ishga tushirishdan oldin ko'rib chiqing.
#
# Ro'yxatni 30–50 taga yetkazish uchun (collector akkaunti bilan):
#     docker compose run --rm collector python -m elon.collector.discover
# Chiqqan qatorlardan mos kelganlarini shu faylga ko'chiring.
#
# Maydonlar: username (majburiy), category (standart: rent), enabled (standart: true).
# Topilmagan yoki yopiq kanalni collector o'zi o'chirib, sababini bazaga yozadi.

